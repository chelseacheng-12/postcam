name: Postcam
options:
  bundleIdPrefix: com.postcam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1"
targets:
  Postcam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Postcam
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.postcam.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Postcam/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    info:
      path: Postcam/Info.plist
schemes:
  Postcam:
    build:
      targets:
        Postcam: all
    run:
      config: Debug
    archive:
      config: Release
